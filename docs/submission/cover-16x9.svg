<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Nunito, Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Nunito:wght@400;700&amp;display=swap');
      .hand { font-family: Caveat, cursive; }
    </style>
    <linearGradient id="kopi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4326"/>
      <stop offset="1" stop-color="#3d2415"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#fdfaf2"/>
  <rect x="0" y="0" width="1600" height="900" fill="none" stroke="#e7ddcc" stroke-width="24"/>
  <line x1="120" y1="0" x2="120" y2="900" stroke="#e8b4b4" stroke-width="2.5" opacity="0.85"/>

  <!-- lubang spiral -->
  <g fill="#e7ddcc">
    <circle cx="70" cy="120" r="15"/><circle cx="70" cy="250" r="15"/><circle cx="70" cy="380" r="15"/>
    <circle cx="70" cy="510" r="15"/><circle cx="70" cy="640" r="15"/><circle cx="70" cy="770" r="15"/>
  </g>

  <text x="180" y="180" class="hand" font-size="46" fill="#b04a2b">catatan kuliah</text>
  <text x="176" y="360" class="hand" font-size="190" font-weight="700" fill="#2b2620">Kopi Pagi</text>
  <text x="186" y="430" font-size="32" fill="#6f6459">PDF kuliah jadi rangkuman dan artikel,</text>
  <text x="186" y="474" font-size="32" fill="#6f6459">satu persetujuan.</text>

  <rect x="186" y="530" width="330" height="70" rx="8" fill="#fff9c9" stroke="#bfae92" stroke-dasharray="6 4"/>
  <text x="212" y="575" class="hand" font-size="34" fill="#6f6459">belajar 5 menit tiap pagi</text>

  <text x="186" y="800" font-size="22" fill="#b04a2b" font-weight="700">Tencent Cloud Hackathon Indonesia 2026</text>
  <text x="186" y="832" font-size="20" fill="#6f6459">Track C · Agen Kreator — Sari Nursita</text>

  <circle cx="1210" cy="430" r="270" fill="#f6efe3"/>
  <circle cx="1210" cy="430" r="270" fill="none" stroke="#e7ddcc" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- buku catatan miring -->
  <g transform="translate(-70,10) rotate(-10 1150 430)">
    <rect x="980" y="250" width="330" height="380" rx="14" fill="#ffffff" stroke="#cfc3ae" stroke-width="2.5"/>
    <line x1="1020" y1="250" x2="1020" y2="630" stroke="#e8b4b4" stroke-width="2"/>
    <g stroke="#dbe6f1" stroke-width="2.5">
      <line x1="1042" y1="330" x2="1272" y2="330"/><line x1="1042" y1="372" x2="1272" y2="372"/>
      <line x1="1042" y1="414" x2="1272" y2="414"/><line x1="1042" y1="456" x2="1230" y2="456"/>
      <line x1="1042" y1="498" x2="1272" y2="498"/><line x1="1042" y1="540" x2="1210" y2="540"/>
    </g>
  </g>

  <!-- cangkir kopi -->
  <ellipse cx="1200" cy="660" rx="160" ry="22" fill="#e7ddcc"/>
  <path d="M1320 500 q70 10 66 66 q-4 52 -62 56" fill="none" stroke="#2b2620" stroke-width="12" stroke-linecap="round"/>
  <path d="M1060 470 h240 v96 q0 74 -74 74 h-92 q-74 0 -74 -74 z" fill="#ffffff" stroke="#2b2620" stroke-width="9" stroke-linejoin="round"/>
  <rect x="1060" y="470" width="240" height="52" fill="url(#kopi)"/>
  <text x="1180" y="507" class="hand" font-size="34" text-anchor="middle" fill="#fdfaf2">kopi pagi</text>
  <ellipse cx="1180" cy="638" rx="150" ry="18" fill="#fdfaf2" opacity="0.5"/>

  <!-- uap -->
  <g fill="none" stroke="#c9b79a" stroke-width="7" stroke-linecap="round" opacity="0.95">
    <path d="M1116 455 q-16 -24 2 -44 q16 -18 2 -38"/>
    <path d="M1180 448 q-18 -26 0 -48 q16 -20 0 -42"/>
    <path d="M1244 455 q-14 -22 2 -40 q14 -16 2 -34"/>
  </g>

  <!-- sticky note acc -->
  <g transform="rotate(7 1420 300)">
    <rect x="1340" y="210" width="200" height="150" rx="4" fill="#fff9c9" stroke="#d9c977"/>
    <rect x="1360" y="196" width="70" height="26" fill="#f2e7b0" opacity="0.85"/>
    <text x="1440" y="272" class="hand" font-size="40" text-anchor="middle" fill="#6f6459">acc?</text>
    <text x="1440" y="322" class="hand" font-size="40" text-anchor="middle" fill="#2f6b3f">sudah ✓</text>
  </g>

  <!-- empat ikon artefak -->
  <g>
    <rect x="960" y="712" width="118" height="96" rx="14" fill="#eef4ec" stroke="#8fae87" stroke-width="2.5"/>
    <text x="1019" y="742" font-size="15" text-anchor="middle" fill="#2b2620" font-weight="700">rangkuman</text>
    <text x="1019" y="784" font-size="26" text-anchor="middle" fill="#6f6459">&#8801;</text>

    <rect x="1096" y="712" width="118" height="96" rx="14" fill="#eef4ec" stroke="#8fae87" stroke-width="2.5"/>
    <text x="1155" y="742" font-size="15" text-anchor="middle" fill="#2b2620" font-weight="700">artikel</text>
    <text x="1155" y="784" font-size="26" text-anchor="middle" fill="#6f6459">&#9998;</text>

    <rect x="1232" y="712" width="118" height="96" rx="14" fill="#eef4ec" stroke="#8fae87" stroke-width="2.5"/>
    <text x="1291" y="742" font-size="15" text-anchor="middle" fill="#2b2620" font-weight="700">audio</text>
    <text x="1291" y="784" font-size="24" text-anchor="middle" fill="#6f6459">&#9654;</text>

    <rect x="1368" y="712" width="118" height="96" rx="14" fill="#eef4ec" stroke="#8fae87" stroke-width="2.5"/>
    <text x="1427" y="742" font-size="15" text-anchor="middle" fill="#2b2620" font-weight="700">soal</text>
    <text x="1427" y="784" font-size="26" text-anchor="middle" fill="#6f6459">?</text>
  </g>
</svg>

